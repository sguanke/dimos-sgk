[pytest]
testpaths = tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=src --cov-report=html --cov-report=term --cov-report=term-missing -v
markers =
    unit: Unit tests
    integration: Integration tests
    simulation: Simulation tests
    safety: Safety-critical tests requiring 100% coverage
