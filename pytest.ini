[pytest]
testpaths = tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=src --cov-report=html --cov-report=term --cov-report=term-missing -v
markers =
    unit: Unit tests
    safety: Safety-critical tests requiring 100% coverage
    vision: Vision module tests
    control: Control module tests
    localization: Localization module tests
