project:
  name: "go2-person-following"
  description: "Go2 robot dog person following system using dimos framework with auto-test-fix loop"

  phases:
    - name: "planning"
      agent: "Plan"
      prompt: |
        Create an implementation plan for a Go2 robot person following system.
        Read CLAUDE.md for architecture decisions and constraints.
        Output detailed plan to .claude/plan.md
      output: ".claude/plan.md"

    - name: "implementation-parallel"
      parallel: true
      dependencies: ["planning"]
      agents:
        - name: "perception-agent"
          agent: "general-purpose"
          isolation: "worktree"
          prompt: |
            Read detailed instructions in .claude/agent_prompts.md under "Perception Agent" section.
            Implement the perception module according to those instructions and CLAUDE.md.
            Focus on vision-related components:
            - src/vision/person_detector.py (YOLO-based detection)
            - src/vision/person_tracker.py (DeepSORT tracking)
            - src/vision/target_selector.py (target selection logic)
            - config/vision_params.yaml

            After implementation:
            1. Create a git commit with message: "Implement perception module (vision detection and tracking)"
            2. Push to current branch
          dependencies: ["planning"]
          output: ".claude/state/perception-agent.json"
          auto_commit: true
          commit_message: "Implement perception module (vision detection and tracking)"

        - name: "navigation-agent"
          agent: "general-purpose"
          isolation: "worktree"
          prompt: |
            Read detailed instructions in .claude/agent_prompts.md under "Navigation Agent" section.
            Implement the navigation and control module according to those instructions and CLAUDE.md.
            Focus on motion control:
            - src/control/motion_controller.py (PID control)
            - src/control/distance_keeper.py (maintain following distance)
            - src/control/path_planner.py (obstacle avoidance path planning)
            - config/robot_params.yaml

            After implementation:
            1. Create a git commit with message: "Implement navigation module (motion control and path planning)"
            2. Push to current branch
          dependencies: ["planning"]
          output: ".claude/state/navigation-agent.json"
          auto_commit: true
          commit_message: "Implement navigation module (motion control and path planning)"

        - name: "localization-agent"
          agent: "general-purpose"
          isolation: "worktree"
          prompt: |
            Read detailed instructions in .claude/agent_prompts.md under "Localization Agent" section.
            Implement the localization and mapping module according to those instructions and CLAUDE.md.
            Focus on localization:
            - src/localization/odometry.py (wheel odometry)
            - src/localization/imu_fusion.py (IMU data fusion)
            - src/localization/pose_estimator.py (robot pose estimation)
            - src/mapping/local_map.py (local obstacle map)

            After implementation:
            1. Create a git commit with message: "Implement localization module (odometry, IMU fusion, mapping)"
            2. Push to current branch
          dependencies: ["planning"]
          output: ".claude/state/localization-agent.json"
          auto_commit: true
          commit_message: "Implement localization module (odometry, IMU fusion, mapping)"

        - name: "safety-agent"
          agent: "general-purpose"
          isolation: "worktree"
          prompt: |
            Read detailed instructions in .claude/agent_prompts.md under "Safety Agent" section.
            Implement the safety monitoring system according to those instructions and CLAUDE.md.
            Focus on safety (CRITICAL):
            - src/safety/safety_monitor.py (emergency stop, collision detection)
            - src/safety/watchdog.py (timeout monitoring)
            - src/safety/health_checker.py (system health monitoring)
            - config/safety_params.yaml
            This is CRITICAL - follow all safety requirements strictly.

            After implementation:
            1. Create a git commit with message: "Implement safety module (monitoring, watchdog, health checks)"
            2. Push to current branch
          dependencies: ["planning"]
          output: ".claude/state/safety-agent.json"
          auto_commit: true
          commit_message: "Implement safety module (monitoring, watchdog, health checks)"

    - name: "implementation-integration"
      parallel: false
      dependencies: ["implementation-parallel"]
      agents:
        - name: "integration-agent"
          agent: "general-purpose"
          prompt: |
            Read detailed instructions in .claude/agent_prompts.md under "Integration Agent" section.

            Access implementation code from these worktree directories:
            - .claude/worktrees/perception-agent/
            - .claude/worktrees/navigation-agent/
            - .claude/worktrees/localization-agent/
            - .claude/worktrees/safety-agent/

            Integrate all modules and create:
            - src/dimos_integration/agent_node.py (wrap components as dimos agents)
            - src/dimos_integration/message_handler.py (inter-agent communication)
            - src/main.py (entry point that coordinates all modules)
            - requirements.txt (all dependencies)
            - README.md (setup and usage)

            Ensure all modules work together correctly.

            After integration:
            1. Create a git commit with message: "Integrate all modules with dimos framework"
            2. Push to current branch
          dependencies: ["implementation-parallel"]
          output: ".claude/state/integration-agent.json"
          auto_commit: true
          commit_message: "Integrate all modules with dimos framework"

    - name: "testing"
      parallel: true
      dependencies: ["implementation-integration"]
      agents:
        - name: "unit-test-agent"
          agent: "general-purpose"
          prompt: |
            Read detailed instructions in .claude/agent_prompts.md under "Unit Test Agent" section.

            Access implementation code from these worktree directories:
            - .claude/worktrees/perception-agent/
            - .claude/worktrees/navigation-agent/
            - .claude/worktrees/localization-agent/
            - .claude/worktrees/safety-agent/

            Write unit tests for all modules in tests/unit/.
            Create test mocks in tests/mocks/.
            Create pytest.ini configuration.
            Target >80% coverage (100% for safety modules).

            After writing tests:
            1. Create a git commit with message: "Add comprehensive unit tests for all modules"
            2. Push to current branch
          dependencies: ["implementation-integration"]
          output: ".claude/state/unit-test-agent.json"
          auto_commit: true
          commit_message: "Add comprehensive unit tests for all modules"

        - name: "integration-test-agent"
          agent: "general-purpose"
          prompt: |
            Read detailed instructions in .claude/agent_prompts.md under "Integration Test Agent" section.

            Access implementation code from worktree directories.

            Write integration tests in tests/integration/ testing:
            - Vision → Control data flow
            - Safety monitor integration
            - Dimos message bus communication
            - Module interactions

            Use real dimos framework, mock hardware.

            After writing tests:
            1. Create a git commit with message: "Add integration tests for module interactions"
            2. Push to current branch
          dependencies: ["implementation-integration"]
          output: ".claude/state/integration-test-agent.json"
          auto_commit: true
          commit_message: "Add integration tests for module interactions"

        - name: "simulation-test-agent"
          agent: "general-purpose"
          prompt: |
            Read detailed instructions in .claude/agent_prompts.md under "Simulation Test Agent" section.

            Access implementation code from worktree directories.

            Write simulation tests in tests/simulation/ with:
            - End-to-end scenario tests
            - Recorded video test data
            - Go2 simulator integration
            - Various scenarios (person stops, turns, occlusion)
            - Test fixtures and mock data

            After writing tests:
            1. Create a git commit with message: "Add simulation tests for end-to-end scenarios"
            2. Push to current branch
          dependencies: ["implementation-integration"]
          output: ".claude/state/simulation-test-agent.json"
          auto_commit: true
          commit_message: "Add simulation tests for end-to-end scenarios"

    # ========================================
    # AUTO TEST-FIX LOOP
    # ========================================
    - name: "auto-test-and-fix"
      dependencies: ["testing"]
      loop:
        max_iterations: 6
        break_on_success: true
      agents:
        - name: "test-runner-agent"
          agent: "general-purpose"
          prompt: |
            Run all tests and collect detailed results.

            Steps:
            1. Install dependencies if needed:
               pip install -r requirements.txt
               pip install pytest pytest-cov pytest-json-report pytest-html

            2. Run pytest with detailed output:
               pytest tests/ \
                 --verbose \
                 --tb=long \
                 --junit-xml=.claude/state/junit.xml \
                 --cov=src \
                 --cov-report=json:.claude/state/coverage.json \
                 --json-report \
                 --json-report-file=.claude/state/test_results.json \
                 --html=.claude/state/test_report.html

            3. Parse the JSON report and create a detailed failure report.
               For each failed test, extract:
               - Test file and test name
               - Error type and message
               - Full traceback
               - Source file and line number where error occurred

            4. Save structured results to .claude/state/test_results.json:
               {
                 "total": N,
                 "passed": N,
                 "failed": N,
                 "failures": [
                   {
                     "id": "failure_1",
                     "test_file": "tests/unit/test_detector.py",
                     "test_name": "test_detect_person",
                     "error_type": "AssertionError",
                     "error_message": "...",
                     "traceback": "...",
                     "source_file": "src/vision/person_detector.py",
                     "source_line": 45
                   }
                 ]
               }

            5. Log summary to console:
               - Total tests: N
               - Passed: N
               - Failed: N
               - Coverage: X%
          output: ".claude/state/test_results.json"

        - name: "debugger-agent"
          agent: "general-purpose"
          condition: "test_results.failed > 0"
          prompt: |
            Analyze test failures and classify by module.

            Read .claude/state/test_results.json

            For each failure:
            1. Read the test code to understand what is being tested
            2. Read the source code file mentioned in the failure
            3. Analyze the error type and identify root cause
            4. Determine which module owns this code:
               - perception: src/vision/*, src/tracking/*
               - navigation: src/control/*, src/planning/*
               - localization: src/localization/*, src/mapping/*
               - safety: src/safety/*
               - integration: src/dimos_integration/*, src/main.py

            5. Classify failures by module and save to separate files:
               - .claude/state/perception_failures.json
               - .claude/state/navigation_failures.json
               - .claude/state/localization_failures.json
               - .claude/state/safety_failures.json
               - .claude/state/integration_failures.json

            Each file format:
            {
              "module": "perception",
              "failures": [
                {
                  "id": "failure_1",
                  "test_file": "...",
                  "source_file": "...",
                  "root_cause": "...",
                  "fix_strategy": "...",
                  "suggested_fix": "..."
                }
              ]
            }

            6. Save summary to .claude/state/failure_summary.json:
            {
              "total_failures": N,
              "by_module": {
                "perception": N,
                "navigation": N,
                "localization": N,
                "safety": N,
                "integration": N
              }
            }
          dependencies: ["test-runner-agent"]
          output: ".claude/state/failure_summary.json"

        # Parallel module-specific fixers (reuse original implementation agents)
        - name: "perception-agent"
          agent: "general-purpose"
          condition: "perception_failures.json exists and not empty"
          prompt: |
            Fix perception module test failures.

            You originally implemented the perception module (vision and tracking).
            Now fix the test failures in your module.

            Read .claude/state/perception_failures.json

            For each failure:
            1. Read the failing test to understand expectations
            2. Read your implementation code
            3. Apply the suggested fix or determine the correct fix
            4. Update the code to pass the test
            5. Ensure no regressions in other parts of the module

            Focus only on perception module files:
            - src/vision/*
            - src/tracking/*

            After fixing, create a commit: "Fix perception module test failures"
          dependencies: ["debugger-agent"]
          output: ".claude/state/perception_fixes.json"
          auto_commit: true
          commit_message: "Fix perception module test failures"

        - name: "navigation-agent"
          agent: "general-purpose"
          condition: "navigation_failures.json exists and not empty"
          prompt: |
            Fix navigation module test failures.

            You originally implemented the navigation module (control and planning).
            Now fix the test failures in your module.

            Read .claude/state/navigation_failures.json

            For each failure:
            1. Read the failing test to understand expectations
            2. Read your implementation code
            3. Apply the suggested fix or determine the correct fix
            4. Update the code to pass the test
            5. Ensure no regressions in other parts of the module

            Focus only on navigation module files:
            - src/control/*
            - src/planning/*

            After fixing, create a commit: "Fix navigation module test failures"
          dependencies: ["debugger-agent"]
          output: ".claude/state/navigation_fixes.json"
          auto_commit: true
          commit_message: "Fix navigation module test failures"

        - name: "localization-agent"
          agent: "general-purpose"
          condition: "localization_failures.json exists and not empty"
          prompt: |
            Fix localization module test failures.

            You originally implemented the localization module (odometry, IMU, mapping).
            Now fix the test failures in your module.

            Read .claude/state/localization_failures.json

            For each failure:
            1. Read the failing test to understand expectations
            2. Read your implementation code
            3. Apply the suggested fix or determine the correct fix
            4. Update the code to pass the test
            5. Ensure no regressions in other parts of the module

            Focus only on localization module files:
            - src/localization/*
            - src/mapping/*

            After fixing, create a commit: "Fix localization module test failures"
          dependencies: ["debugger-agent"]
          output: ".claude/state/localization_fixes.json"
          auto_commit: true
          commit_message: "Fix localization module test failures"

        - name: "safety-agent"
          agent: "general-purpose"
          condition: "safety_failures.json exists and not empty"
          prompt: |
            Fix safety module test failures.

            You originally implemented the safety module (monitoring, watchdog, health checks).
            Now fix the test failures in your module.

            Read .claude/state/safety_failures.json

            For each failure:
            1. Read the failing test to understand expectations
            2. Read your implementation code
            3. Apply the suggested fix or determine the correct fix
            4. Update the code to pass the test
            5. CRITICAL: Ensure all safety checks remain active and functional
            6. Never disable or mock safety checks in production code

            Focus only on safety module files:
            - src/safety/*

            After fixing, create a commit: "Fix safety module test failures"
          dependencies: ["debugger-agent"]
          output: ".claude/state/safety_fixes.json"
          auto_commit: true
          commit_message: "Fix safety module test failures"

        - name: "integration-agent"
          agent: "general-purpose"
          condition: "integration_failures.json exists and not empty"
          prompt: |
            Fix integration layer test failures.

            You originally integrated all modules with the dimos framework.
            Now fix the test failures in the integration layer.

            Read .claude/state/integration_failures.json

            For each failure:
            1. Read the failing test to understand expectations
            2. Read the integration code
            3. Apply the suggested fix or determine the correct fix
            4. Update the code to pass the test
            5. Ensure module interactions remain correct

            Focus only on integration files:
            - src/dimos_integration/*
            - src/main.py

            After fixing, create a commit: "Fix integration layer test failures"
          dependencies: ["debugger-agent"]
          output: ".claude/state/integration_fixes.json"
          auto_commit: true
          commit_message: "Fix integration layer test failures"

    - name: "review"
      agent: "general-purpose"
      prompt: |
        Read detailed instructions in .claude/agent_prompts.md under "Review Agent" section.

        Review all implementations and tests by reading from:
        - Main branch (merged integration-agent code)
        - tests/unit/ (unit tests)
        - tests/integration/ (integration tests)
        - tests/simulation/ (simulation tests)
        - .claude/state/test_results.json (final test results)
        - .claude/state/verification_results.json (fix verification)

        Check against CLAUDE.md requirements:
        - Architecture compliance
        - Code quality and safety
        - Test coverage (should be >80%, 100% for safety)
        - Module integration correctness
        - All tests passing

        Output comprehensive review report to .claude/state/review.md

        IMPORTANT: If review finds critical issues, set exit code to indicate failure.
      dependencies: ["auto-test-and-fix"]
      output: ".claude/state/review.md"

    - name: "final-integration"
      agent: "general-purpose"
      prompt: |
        Read the review report from .claude/state/review.md

        If review PASSED:
        1. Verify all code is already on main branch (integration-agent merged it)
        2. Merge test code to main branch:
           - tests/unit/
           - tests/integration/
           - tests/simulation/
           - tests/mocks/
           - pytest.ini
        3. Run full test suite one final time: pytest tests/ --verbose
        4. Create summary report with:
           - All modules implemented
           - Final test results (should be 100% passing)
           - Coverage report
           - Integration status
           - Auto-fix statistics (how many issues fixed automatically)
        5. Save report to .claude/state/final-integration.json

        If review FAILED:
        1. Report the failure
        2. List blocking issues from review
        3. Exit with error

        Follow CLAUDE.md conflict resolution rules if needed.
      dependencies: ["review"]
      output: ".claude/state/final-integration.json"

  error_handling:
    max_retries: 2
    on_failure: "save_state_and_exit"

  state_dir: ".claude/state"
  worktree_dir: ".claude/worktrees"
